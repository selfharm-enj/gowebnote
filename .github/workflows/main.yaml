name: CI

on:
  push:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          go-version-file: "go.mod"
          cache-dependency-path: "go.sum"
          architecture: "x64"
          cache: true
      
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12
      
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          go-version-file: "go.mod"
          cache-dependency-path: "go.sum"
          architecture: "x64"
          cache: true
      
      - name: Get go modules
        run: go mod download
      
      - name: Run build
        run: GOARCH=amd64 GOOS=linux go build -o noteapp ./cmd/main.go
